# OAI-CN5G-NEF Configuration File

############# Common configuration

log_level:
  general: debug

# Register to NRF so other NFs can discover NEF
register_nf:
  general: yes

############## SBI Interfaces
nfs:
  nrf:
    host: oai-nrf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  amf:
    host: oai-amf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  smf:
    host: oai-smf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  pcf:
    host: oai-pcf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  udr:
    host: oai-udr
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  nef:
    host: oai-nef-test
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
############## NEF-specific configuration
nef:
  # Comma-separated list of supported northbound services
  support_features: >
    nnef-eventexposure,
    nnef-pfdmanagement,
    nnef-trafficinfluence,
    nnef-bdtpolicycontrol,
    nnef-qosmonitoring,
    nnef-analyticsexposure
  # AF/SCS whitelist. An empty (or omitted) whitelist allows no AF on its own:
  # with jwt_secret also empty, every request is denied unless
  # insecure_dev_mode is true.
  # Each entry: af_id (required), allowed_apis (optional, service names from
  # src/common/nef.h), api_key (optional, but parsed only: it is not checked).
  # Example (uncomment to restrict access):
  # af_whitelist:
  #   - af_id: "my-af-1"
  #     allowed_apis:
  #       - nnef-eventexposure
  #       - nnef-trafficinfluence
  #   - af_id: "my-af-2"
  #     # no allowed_apis = all APIs allowed for this AF
  af_whitelist: []
  security:
    # HMAC-SHA256 secret used to validate AF bearer tokens (JWT). NEF does not
    # issue tokens. MUST be set to a strong random secret in production.
    # Empty: JWT is not used. Requests without a token are checked against
    # af_whitelist, and any request that carries a token is rejected.
    jwt_secret: ""
    # Set to true ONLY for development/testing to allow requests when no JWT
    # secret and no AF whitelist are configured (fail-open).  Default: false
    # (fail-closed: all requests denied when auth is unconfigured).
    # WARNING: NEVER enable in production — all access is unrestricted.
    insecure_dev_mode: true
